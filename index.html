<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F9F7F4' rx='20'/><rect x='15' y='15' width='70' height='70' fill='none' stroke='%23D4B5C4' stroke-width='2' rx='8'/><line x1='30' y1='35' x2='70' y2='35' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='50' x2='70' y2='50' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='65' x2='70' y2='65' stroke='%23D4B5C4' stroke-width='2'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F9F7F4;
      padding: 2rem 1rem;
      color: #4A4240;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .date-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .date-controls button {
      padding: 8px 12px;
      background: #D4B5C4;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .date-controls button:hover {
      background: #C09DB5;
    }

    .date-controls input {
      padding: 8px 12px;
      border: 1px solid #D4B5C4;
      border-radius: 4px;
      font-size: 14px;
    }

    .template-panel {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: white;
      border-radius: 6px;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      display: none;
    }

    .template-panel.open {
      display: block;
    }

    .template-title {
      font-size: 12px;
      font-weight: 600;
      color: #4A4240;
      margin-bottom: 0.4rem;
    }

    .template-desc {
      font-size: 11px;
      color: #8B7B78;
      line-height: 1.6;
      margin-bottom: 0.9rem;
    }

    .template-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .template-actions button {
      padding: 7px 12px;
      border: 1px solid #E0D2DA;
      background: white;
      color: #6B5F5C;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }

    .template-actions button:hover {
      background: #FAF6F8;
      border-color: #C99BB4;
      color: #4A4240;
    }

    .template-actions button.danger:hover {
      border-color: #D9A3A0;
      color: #B05450;
    }

    .progress-section {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: white;
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .progress-block {
      margin-bottom: 1rem;
    }

    .progress-block:last-child {
      margin-bottom: 0;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 600;
      color: #4A4240;
    }

    .progress-label.sub {
      font-weight: 400;
      color: #8B7B78;
      font-size: 11px;
    }

    .progress-count {
      font-size: 12px;
      color: #8B7B78;
    }

    .progress-bar {
      height: 12px;
      background: #F0EAE5;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar.sub {
      height: 6px;
      border-radius: 3px;
    }

    .progress-fill {
      height: 100%;
      background: #C99BB4;
      border-radius: 6px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-fill.sub {
      background: #DCCBD4;
      border-radius: 3px;
    }

    .week-strip {
      display: flex;
      gap: 6px;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid #F0EAE5;
    }

    .week-day {
      flex: 1;
      text-align: center;
      cursor: pointer;
    }

    .week-day-bar {
      height: 44px;
      background: #F5F0EB;
      border-radius: 3px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .week-day-fill {
      width: 100%;
      background: #C99BB4;
      border-radius: 3px 3px 0 0;
    }

    .week-day-label {
      font-size: 9px;
      color: #B8A9A5;
    }

    .week-day.is-today .week-day-label {
      color: #C99BB4;
      font-weight: 700;
    }

    .carryover-badge {
      display: inline-block;
      font-size: 9px;
      color: #B8875F;
      background: #F5E9DC;
      border-radius: 2px;
      padding: 1px 4px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .main {
      display: flex;
      gap: 1.5rem;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      min-height: 600px;
    }

    .sidebar {
      width: 280px;
      padding: 1.5rem;
      border-right: 1px solid #E8DFD9;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #4A4240;
      margin-bottom: 1rem;
      margin-top: 1.5rem;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .checklist-input {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .checklist-input input {
      flex: 1;
      padding: 6px 8px;
      border: 0.5px solid #E8DFD9;
      border-radius: 3px;
      font-size: 12px;
    }

    .checklist-input button {
      width: 30px;
      background: #D4B5C4;
      border: none;
      color: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }

    .type-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 0.6rem;
    }

    .type-toggle button {
      flex: 1;
      padding: 5px 0;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid #E8DFD9;
      background: white;
      color: #8B7B78;
      border-radius: 3px;
      cursor: pointer;
    }

    .type-toggle button.active {
      background: #F3E7EE;
      border-color: #C99BB4;
      color: #8A5A75;
      font-weight: 600;
    }

    .list-group {
      margin-bottom: 1rem;
    }

    .list-group-title {
      font-size: 10px;
      color: #B8A9A5;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    .list-empty {
      font-size: 11px;
      color: #C9BDB9;
      padding: 0.3rem 0 0.6rem;
    }

    .checklist-item.long {
      background: #F1F0F5;
    }

    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .checklist-item {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem;
      background: #F5F0EB;
      border-radius: 3px;
      font-size: 12px;
      align-items: flex-start;
    }

    .checklist-item input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .checklist-item span {
      flex: 1;
      word-break: break-word;
    }

    .checklist-item.done span {
      text-decoration: line-through;
      color: #B8A9A5;
    }

    .checklist-item .delete-btn {
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    .memo-area {
      display: block;
    }

    .memo-area textarea {
      display: block;
      width: 100%;
      height: 160px;
      padding: 8px;
      border: 0.5px solid #E8DFD9;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      line-height: 1.5;
      resize: vertical;
      min-height: 80px;
      max-height: 600px;
      outline: none;
    }

    .memo-area textarea:focus {
      border-color: #D4B5C4;
    }

    .timeline {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .timeline-header {
      display: flex;
      border-bottom: 1px solid #E8DFD9;
      flex-shrink: 0;
    }

    .timeline-header-item {
      flex: 1;
      padding: 1rem;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #8B7B78;
      border-right: 1px solid #E8DFD9;
    }

    .timeline-header-item:last-child {
      border-right: none;
    }

    .timeline-rows {
      flex: 1;
      display: flex;
      overflow-y: auto;
    }

    .timeline-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #E8DFD9;
    }

    .timeline-col:last-child {
      border-right: none;
    }

    .hour-row {
      display: flex;
      border-bottom: 1px solid #E8DFD9;
      min-height: 60px;
    }

    .hour-label {
      width: 40px;
      min-width: 40px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #B8A9A5;
      background: #FEFDFB;
      border-right: 1px solid #EBE2DD;
    }

    .hour-content {
      flex: 1;
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .hour-textarea {
      flex: 1;
      padding: 6px;
      border: none;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      resize: none;
      outline: none;
    }

    .match-btn {
      width: 24px;
      min-width: 24px;
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    .match-btn.active {
      color: #D4B5C4;
      font-weight: bold;
    }

    .copy-btn {
      width: 24px;
      min-width: 24px;
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    .copy-btn:hover {
      color: #D4B5C4;
    }

    .hour-row.matched .hour-textarea {
      background: rgba(212, 181, 196, 0.15);
    }

    .hour-row.past {
      background: #F9F7F4;
    }

    .hour-row.past .hour-label {
      background: #F5F0EB;
    }

    .hour-row.current .hour-label {
      background: #D4B5C4;
      color: white;
    }

    .hour-label.clickable {
      cursor: pointer;
      user-select: none;
    }

    /* 핵심 항목 - 기본(아직 실행 전): 앰버 강조 */
    .hour-row.focus {
      background: #FDF6EA;
      box-shadow: inset 4px 0 0 #D9A441;
    }

    .hour-row.focus .hour-label {
      background: #F6E8CC;
      color: #A9752A;
      font-weight: 700;
    }

    .hour-row.focus .hour-textarea {
      font-weight: 600;
      color: #6B4E1E;
      background: transparent;
    }

    /* 핵심 항목 - 실행 완료: 초록 */
    .hour-row.focus.matched {
      background: #EEF5EA;
      box-shadow: inset 4px 0 0 #77A05B;
    }

    .hour-row.focus.matched .hour-label {
      background: #E1EDD9;
      color: #4F7038;
    }

    .hour-row.focus.matched .hour-textarea {
      color: #3F5C2C;
      background: transparent;
    }

    .hour-row.focus.matched .match-btn.active {
      color: #77A05B;
    }

    /* 핵심 항목 - 시간이 지났는데 미실행: 붉은 경고 */
    .hour-row.focus.past:not(.matched) {
      background: #FBEDEC;
      box-shadow: inset 4px 0 0 #C2544F;
    }

    .hour-row.focus.past:not(.matched) .hour-label {
      background: #F5DAD8;
      color: #A8403C;
    }

    .hour-row.focus.past:not(.matched) .hour-textarea {
      color: #A8403C;
      background: transparent;
    }

    /* 핵심 항목 - 현재 시간 */
    .hour-row.focus.current .hour-label {
      background: #D9A441;
      color: white;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.5rem;
      }

      .header h1 {
        font-size: 20px;
        margin-bottom: 1rem;
      }

      .date-controls {
        gap: 0.4rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .date-controls button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .date-controls input {
        font-size: 14px;
        padding: 8px;
      }

      .progress-section {
        padding: 0.8rem 1rem;
        margin-bottom: 1rem;
      }

      .main {
        flex-direction: column;
        gap: 0;
        min-height: 0;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #E8DFD9;
        padding: 1rem;
      }

      .memo-area textarea {
        height: 130px;
        font-size: 13px;
      }

      .timeline {
        overflow: visible;
      }

      .timeline-header {
        position: sticky;
        top: 0;
        background: white;
        z-index: 5;
      }

      .timeline-header-item {
        padding: 0.7rem;
      }

      .timeline-rows {
        overflow: visible;
      }

      .hour-row {
        min-height: 52px;
      }

      .hour-label {
        width: 30px;
        min-width: 30px;
        padding: 6px 2px;
        font-size: 10px;
      }

      .hour-content {
        padding: 2px;
        gap: 2px;
      }

      .hour-textarea {
        padding: 4px;
        font-size: 13px;
        min-width: 0;
      }

      .match-btn,
      .copy-btn {
        width: 26px;
        min-width: 26px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Daily Planner</h1>
      <div class="date-controls">
        <button id="prevBtn">← 어제</button>
        <input type="date" id="dateInput">
        <button id="todayBtn">오늘</button>
        <button id="nextBtn">내일 →</button>
        <button id="syncBtn" title="이 기기의 오늘 데이터를 시트로 올리고 다시 불러옵니다">↻ 동기화</button>
        <button id="templateBtn" title="요일별 반복 일정 관리">템플릿</button>
      </div>
    </div>

    <div class="template-panel" id="templatePanel">
      <div class="template-title" id="templateTitle">템플릿</div>
      <div class="template-desc" id="templateDesc"></div>
      <div class="template-actions">
        <button id="tplSave">이 날의 계획을 템플릿으로 저장</button>
        <button id="tplApply">템플릿 불러오기</button>
        <button id="tplDelete" class="danger">템플릿 삭제</button>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-label">핵심 실행률</span>
          <span class="progress-count" id="focusCount">0 / 0 (0%)</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="focusFill"></div>
        </div>
      </div>

      <div class="progress-block">
        <div class="progress-header">
          <span class="progress-label sub">전체 실행률</span>
          <span class="progress-count" id="progressCount">0 / 0 (0%)</span>
        </div>
        <div class="progress-bar sub">
          <div class="progress-fill sub" id="progressFill"></div>
        </div>
      </div>

      <div class="week-strip" id="weekStrip"></div>
    </div>

    <div class="main">
      <!-- 왼쪽 사이드바 -->
      <div class="sidebar">
        <div class="section-title">체크리스트</div>
        <div class="type-toggle">
          <button id="typeShort" class="active" data-type="short">단기</button>
          <button id="typeLong" data-type="long">장기</button>
        </div>
        <div class="checklist-input">
          <input type="text" id="checklistInput" placeholder="추가하기">
          <button id="addChecklistBtn">+</button>
        </div>
        <div class="checklist-list" id="checklistList"></div>

        <div class="section-title">메모</div>
        <div class="memo-area">
          <textarea id="memoInput" placeholder="오늘의 메모"></textarea>
        </div>
      </div>

      <!-- 오른쪽 타임라인 -->
      <div class="timeline">
        <div class="timeline-header">
          <div class="timeline-header-item">PLAN</div>
          <div class="timeline-header-item">ACTUAL</div>
        </div>
        <div class="timeline-rows">
          <div class="timeline-col" id="planCol"></div>
          <div class="timeline-col" id="actualCol"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1R6g9pkgX-p8jBkPU3byBZPjvq8Uj4fDUbdP6dkPQ1ZI';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyl4yAJKpb1mK4rO0nskCxZN4c8EI9gnocfg9GDB6ptb7A8gwI35YRKKErccGQ0F6E5/exec';

    // 오늘 날짜 설정
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else {
            field += c;
          }
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c === '\r') { /* skip */ }
          else field += c;
        }
      }

      if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    }

    // 데이터 불러오기
    function loadAllData() {
      const url = CSV_URL + '&_=' + Date.now();

      fetch(url, { cache: 'no-store' })
        .then(r => r.text())
        .then(csv => {
          const rows = parseCSV(csv).slice(1);

          rows.forEach(parts => {
            if (parts.length < 4) return;

            const date = (parts[0] || '').trim();
            const type = (parts[1] || '').trim();
            const hour = (parts[2] || '').trim();
            const content = parts[3] || '';

            if (!date || !type) return;

            if (type === 'plan' || type === 'actual') {
              const key = 'aurora-' + date;
              const saved = localStorage.getItem(key);
              const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
              data[type][hour] = content;
              localStorage.setItem(key, JSON.stringify(data));
            } else if (type === 'memo') {
              localStorage.setItem('aurora-memo-' + date, content);
            } else if (type === 'checklist') {
              try {
                const parsed = JSON.parse(content);
                if (Array.isArray(parsed)) {
                  localStorage.setItem('aurora-checklist-' + date, JSON.stringify(parsed));
                }
              } catch (e) {
                // 파싱 실패 시 무시
              }
            } else if (type === 'focus') {
              try {
                const parsed = JSON.parse(content);
                if (parsed && typeof parsed === 'object') {
                  localStorage.setItem('aurora-focus-' + date, JSON.stringify(parsed));
                }
              } catch (e) {
                // 파싱 실패 시 무시
              }
            } else if (type === 'template' && date.startsWith('template-')) {
              const dow = date.replace('template-', '');
              if (content.trim() === '') {
                localStorage.removeItem('aurora-template-' + dow);
              } else {
                try {
                  const parsed = JSON.parse(content);
                  if (parsed && parsed.plan) {
                    localStorage.setItem('aurora-template-' + dow, JSON.stringify(parsed));
                  }
                } catch (e) {
                  // 파싱 실패 시 무시
                }
              }
            }
          });

          console.log('시트에서 ' + rows.length + '행 로드');
          renderPage();
          renderChecklist();
        })
        .catch(err => {
          console.log('데이터 로드 실패, 로컬 데이터 사용:', err);
          renderPage();
          renderChecklist();
        });
    }

    function renderPage() {
      const dateStr = document.getElementById('dateInput').value;

      // 오늘 이후 날짜이고 계획이 완전히 비어 있으면 요일 템플릿 자동 적용
      if (dateStr >= today && isPlanEmpty(dateStr) && getTemplate(getDow(dateStr))) {
        applyTemplate(dateStr, false);
      }

      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };

      // 타임라인 렌더링
      const planCol = document.getElementById('planCol');
      const actualCol = document.getElementById('actualCol');
      planCol.innerHTML = '';
      actualCol.innerHTML = '';

      const now = new Date();
      const currentHour = now.getHours();
      const isToday = dateStr === today;

      const focusData = getFocus(dateStr);

      for (let h = 6; h < 24; h++) {
        const hourStr = String(h).padStart(2, '0');
        const isPast = isToday && h < currentHour;

        // PLAN
        const planRow = document.createElement('div');
        planRow.className = 'hour-row' + (isPast ? ' past' : '') + (focusData[h] ? ' focus' : '');
        planRow.dataset.hour = h;
        planRow.innerHTML = `
          <div class="hour-label clickable" title="클릭하면 핵심 항목으로 지정/해제">${hourStr}</div>
          <div class="hour-content">
            <textarea class="hour-textarea plan-textarea" data-hour="${h}"></textarea>
            <button class="match-btn" data-hour="${h}" title="매칭">✓</button>
            <button class="copy-btn" data-hour="${h}" title="복사">📋</button>
          </div>
        `;
        planCol.appendChild(planRow);

        const planTA = planRow.querySelector('.plan-textarea');
        planTA.value = data.plan[h] || '';
        planTA.addEventListener('input', () => {
          data.plan[h] = planTA.value;
          localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
          syncToSheet(dateStr, 'plan', h, planTA.value);
          updateMatching(dateStr, h);
        });

        planRow.querySelector('.match-btn').addEventListener('click', () => toggleMatch(dateStr, h));
        planRow.querySelector('.copy-btn').addEventListener('click', () => copyToActual(h, data));
        planRow.querySelector('.hour-label').addEventListener('click', () => toggleFocus(dateStr, h));

        // ACTUAL
        const actualRow = document.createElement('div');
        actualRow.className = 'hour-row' + (isPast ? ' past' : '') + (focusData[h] ? ' focus' : '');
        actualRow.dataset.hour = h;
        actualRow.innerHTML = `
          <div class="hour-label clickable" title="클릭하면 핵심 항목으로 지정/해제">${hourStr}</div>
          <div class="hour-content">
            <textarea class="hour-textarea actual-textarea" data-hour="${h}"></textarea>
            <button class="match-btn" data-hour="${h}" title="매칭">✓</button>
          </div>
        `;
        actualCol.appendChild(actualRow);

        const actualTA = actualRow.querySelector('.actual-textarea');
        actualTA.value = data.actual[h] || '';
        actualTA.addEventListener('input', () => {
          data.actual[h] = actualTA.value;
          localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
          syncToSheet(dateStr, 'actual', h, actualTA.value);
          updateMatching(dateStr, h);
        });

        actualRow.querySelector('.match-btn').addEventListener('click', () => toggleMatch(dateStr, h));
        actualRow.querySelector('.hour-label').addEventListener('click', () => toggleFocus(dateStr, h));

        updateMatching(dateStr, h);
      }

      // 메모 렌더링 (리스너는 아래에서 한 번만 등록)
      document.getElementById('memoInput').value = localStorage.getItem('aurora-memo-' + dateStr) || '';

      updateProgress();
    }

    function getFocus(dateStr) {
      try {
        return JSON.parse(localStorage.getItem('aurora-focus-' + dateStr) || '{}');
      } catch (e) {
        return {};
      }
    }

    function toggleFocus(dateStr, hour) {
      const focus = getFocus(dateStr);
      if (focus[hour]) delete focus[hour];
      else focus[hour] = true;
      localStorage.setItem('aurora-focus-' + dateStr, JSON.stringify(focus));
      syncToSheet(dateStr, 'focus', '', JSON.stringify(focus));
      renderPage();
    }

    // 특정 날짜의 집계: {focusDone, focusTotal, allDone, allTotal}
    function computeStats(dateStr) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};
      const focus = getFocus(dateStr);

      let focusDone = 0, focusTotal = 0, allDone = 0, allTotal = 0;

      for (let h = 6; h < 24; h++) {
        const planValue = (data.plan[h] || '').trim();
        if (planValue === '') continue;

        const actualValue = (data.actual[h] || '').trim();
        const isDone = (planValue === actualValue) || matchedData[h] === true;

        allTotal++;
        if (isDone) allDone++;

        if (focus[h]) {
          focusTotal++;
          if (isDone) focusDone++;
        }
      }

      return { focusDone, focusTotal, allDone, allTotal };
    }

    function updateProgress() {
      const dateStr = document.getElementById('dateInput').value;
      const s = computeStats(dateStr);

      const focusPct = s.focusTotal === 0 ? 0 : Math.round((s.focusDone / s.focusTotal) * 100);
      document.getElementById('focusCount').textContent =
        s.focusTotal === 0 ? '핵심 항목 없음' : `${s.focusDone} / ${s.focusTotal} (${focusPct}%)`;
      document.getElementById('focusFill').style.width = focusPct + '%';

      const allPct = s.allTotal === 0 ? 0 : Math.round((s.allDone / s.allTotal) * 100);
      document.getElementById('progressCount').textContent = `${s.allDone} / ${s.allTotal} (${allPct}%)`;
      document.getElementById('progressFill').style.width = allPct + '%';

      renderWeekStrip(dateStr);
    }

    function renderWeekStrip(dateStr) {
      const strip = document.getElementById('weekStrip');
      strip.innerHTML = '';

      const base = new Date(dateStr + 'T00:00:00');

      // 이 날짜가 속한 주의 월요일 구하기 (일요일은 저번 주 월요일 기준)
      const dow = base.getDay();
      const offsetToMonday = dow === 0 ? -6 : 1 - dow;
      const monday = new Date(base);
      monday.setDate(monday.getDate() + offsetToMonday);

      const labels = ['월', '화', '수', '목', '금', '토', '일'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        const ds = d.toISOString().split('T')[0];
        const s = computeStats(ds);
        const pct = s.focusTotal === 0 ? 0 : Math.round((s.focusDone / s.focusTotal) * 100);

        const div = document.createElement('div');
        div.className = 'week-day' + (ds === dateStr ? ' is-today' : '');
        div.title = `${ds} · 핵심 ${s.focusDone}/${s.focusTotal}`;
        div.innerHTML = `
          <div class="week-day-bar">
            <div class="week-day-fill" style="height:${pct}%"></div>
          </div>
          <div class="week-day-label">${labels[i]}</div>
        `;
        div.addEventListener('click', () => goToDate(ds));
        strip.appendChild(div);
      }
    }

    function updateMatching(dateStr, hour) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};

      const planTA = document.querySelector(`#planCol .plan-textarea[data-hour="${hour}"]`);
      const actualTA = document.querySelector(`#actualCol .actual-textarea[data-hour="${hour}"]`);

      if (!planTA || !actualTA) return;

      const planRow = planTA.closest('.hour-row');
      const actualRow = actualTA.closest('.hour-row');

      if (!planRow || !actualRow) return;

      const planValue = (data.plan[hour] || '').trim();
      const actualValue = (data.actual[hour] || '').trim();
      const isManualMatch = matchedData[hour] === true;
      const isAutoMatch = planValue === actualValue && planValue !== '';

      if (isAutoMatch || isManualMatch) {
        planRow.classList.add('matched');
        actualRow.classList.add('matched');
      } else {
        planRow.classList.remove('matched');
        actualRow.classList.remove('matched');
      }

      const planBtn = planRow.querySelector('.match-btn');
      const actualBtn = actualRow.querySelector('.match-btn');
      if (isManualMatch) {
        planBtn.classList.add('active');
        actualBtn.classList.add('active');
      } else {
        planBtn.classList.remove('active');
        actualBtn.classList.remove('active');
      }

      updateProgress();
    }

    function toggleMatch(dateStr, hour) {
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};
      matchedData[hour] = !matchedData[hour];
      localStorage.setItem('aurora-matched-' + dateStr, JSON.stringify(matchedData));
      updateMatching(dateStr, hour);
    }

    function copyToActual(hour, data) {
      const saved = localStorage.getItem('aurora-' + document.getElementById('dateInput').value);
      const currentData = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      currentData.actual[hour] = currentData.plan[hour];
      const dateStr = document.getElementById('dateInput').value;
      localStorage.setItem('aurora-' + dateStr, JSON.stringify(currentData));
      syncToSheet(dateStr, 'actual', hour, currentData.plan[hour]);
      renderPage();
    }

    const syncTimers = {};

    function syncToSheet(dateStr, type, hour, content) {
      const key = `${dateStr}-${type}-${hour}`;
      
      // 기존 타이머 취소
      if (syncTimers[key]) {
        clearTimeout(syncTimers[key]);
      }
      
      // 1초 후에 저장 (입력이 멈춘 후)
      syncTimers[key] = setTimeout(() => {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ date: dateStr, type, hour, content })
        }).catch(err => console.log('Sync 실패:', err));
        delete syncTimers[key];
      }, 1000);
    }

    // 날짜 컨트롤
    function goToDate(dateStr) {
      document.getElementById('dateInput').value = dateStr;
      renderPage();
      renderChecklist();
      if (document.getElementById('templatePanel').classList.contains('open')) refreshTemplatePanel();
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      const date = new Date(document.getElementById('dateInput').value);
      date.setDate(date.getDate() - 1);
      goToDate(date.toISOString().split('T')[0]);
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      goToDate(today);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const date = new Date(document.getElementById('dateInput').value);
      date.setDate(date.getDate() + 1);
      goToDate(date.toISOString().split('T')[0]);
    });

    document.getElementById('dateInput').addEventListener('change', () => {
      renderPage();
      renderChecklist();
    });

    // 메모 리스너 (최초 1회만 등록, 저장 시점의 날짜를 그때그때 읽음)
    document.getElementById('memoInput').addEventListener('input', (e) => {
      const d = document.getElementById('dateInput').value;
      localStorage.setItem('aurora-memo-' + d, e.target.value);
      syncToSheet(d, 'memo', '', e.target.value);
    });

    // 강제 동기화: 이 기기의 현재 날짜 데이터를 시트로 밀어올림
    document.getElementById('syncBtn').addEventListener('click', () => {
      const dateStr = document.getElementById('dateInput').value;
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };

      let count = 0;

      for (let h = 6; h < 24; h++) {
        const p = (data.plan[h] || '').trim();
        const a = (data.actual[h] || '').trim();
        if (p) { syncToSheet(dateStr, 'plan', h, data.plan[h]); count++; }
        if (a) { syncToSheet(dateStr, 'actual', h, data.actual[h]); count++; }
      }

      const memo = localStorage.getItem('aurora-memo-' + dateStr);
      if (memo && memo.trim()) { syncToSheet(dateStr, 'memo', '', memo); count++; }

      // 이 기기에 있는 모든 날짜의 체크리스트와 핵심 지정을 올림
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;

        if (key.startsWith('aurora-checklist-')) {
          const keyDate = key.replace('aurora-checklist-', '');
          const items = localStorage.getItem(key);
          if (items && items !== '[]') { syncToSheet(keyDate, 'checklist', '', items); count++; }
        } else if (key.startsWith('aurora-focus-')) {
          const keyDate = key.replace('aurora-focus-', '');
          const items = localStorage.getItem(key);
          if (items && items !== '{}') { syncToSheet(keyDate, 'focus', '', items); count++; }
        } else if (key.startsWith('aurora-template-')) {
          const dow = key.replace('aurora-template-', '');
          const items = localStorage.getItem(key);
          if (items) { syncToSheet('template-' + dow, 'template', '', items); count++; }
        }
      }

      alert(count + '건을 시트로 올렸습니다. 잠시 후 다른 기기에서 새로고침하세요.');
    });

    // 체크리스트
    function addChecklistItem() {
      const input = document.getElementById('checklistInput');
      if (!input.value.trim()) return;

      const dateStr = document.getElementById('dateInput').value;
      const checklists = JSON.parse(localStorage.getItem('aurora-checklist-' + dateStr) || '[]');
      checklists.push({ id: Date.now(), text: input.value.trim(), checked: false, type: currentType });
      saveChecklist(dateStr, checklists);
      input.value = '';
      renderChecklist();
    }

    document.getElementById('addChecklistBtn').addEventListener('click', addChecklistItem);
    document.getElementById('checklistInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addChecklistItem();
    });

    function saveChecklist(dateStr, items) {
      localStorage.setItem('aurora-checklist-' + dateStr, JSON.stringify(items));
      syncToSheet(dateStr, 'checklist', '', JSON.stringify(items));
    }

    let currentType = 'short';

    document.querySelectorAll('.type-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentType = btn.dataset.type;
        document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('checklistInput').focus();
      });
    });

    function itemType(item) {
      return item.type === 'long' ? 'long' : 'short';
    }

    function renderChecklist() {
      const dateStr = document.getElementById('dateInput').value;
      const checklistKey = 'aurora-checklist-' + dateStr;
      const checklists = JSON.parse(localStorage.getItem(checklistKey) || '[]');

      // 이전 날짜들의 미완료 항목 수집
      const carryovers = [];
      const seen = new Set(checklists.map(c => c.text));

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('aurora-checklist-')) continue;

        const keyDate = key.replace('aurora-checklist-', '');
        if (keyDate >= dateStr) continue;

        let items;
        try {
          items = JSON.parse(localStorage.getItem(key) || '[]');
        } catch (e) {
          continue;
        }

        items.forEach(item => {
          if (item.checked) return;
          if (seen.has(item.text)) return;
          seen.add(item.text);
          carryovers.push({ item, sourceDate: keyDate, sourceKey: key });
        });
      }

      carryovers.sort((a, b) => a.sourceDate.localeCompare(b.sourceDate));

      const list = document.getElementById('checklistList');
      list.innerHTML = '';

      renderGroup(list, 'short', '단기', checklists, carryovers, dateStr, checklistKey);
      renderGroup(list, 'long', '장기', checklists, carryovers, dateStr, checklistKey);
    }

    function renderGroup(list, type, label, checklists, carryovers, dateStr, checklistKey) {
      const mine = checklists.filter(c => itemType(c) === type);
      const carried = carryovers.filter(c => itemType(c.item) === type);
      const total = mine.length + carried.length;
      const doneCount = mine.filter(c => c.checked).length;

      const group = document.createElement('div');
      group.className = 'list-group';

      const title = document.createElement('div');
      title.className = 'list-group-title';
      title.innerHTML = `<span>${label}</span><span>${doneCount}/${total}</span>`;
      group.appendChild(title);

      if (total === 0) {
        const empty = document.createElement('div');
        empty.className = 'list-empty';
        empty.textContent = '없음';
        group.appendChild(empty);
        list.appendChild(group);
        return;
      }

      // 이월 항목 먼저
      carried.forEach(({ item, sourceDate, sourceKey }) => {
        const div = document.createElement('div');
        div.className = 'checklist-item' + (type === 'long' ? ' long' : '');
        div.innerHTML = `
          <input type="checkbox">
          <span><span class="carryover-badge">${sourceDate.slice(5)}</span>${item.text}</span>
          <button class="delete-btn">×</button>
        `;

        div.querySelector('input').addEventListener('change', (e) => {
          const sourceItems = JSON.parse(localStorage.getItem(sourceKey) || '[]');
          const target = sourceItems.find(s => s.id === item.id);
          if (target) {
            target.checked = e.target.checked;
            saveChecklist(sourceDate, sourceItems);
          }
          div.classList.toggle('done', e.target.checked);
        });

        div.querySelector('.delete-btn').addEventListener('click', () => {
          const sourceItems = JSON.parse(localStorage.getItem(sourceKey) || '[]');
          const idx = sourceItems.findIndex(s => s.id === item.id);
          if (idx > -1) {
            sourceItems.splice(idx, 1);
            saveChecklist(sourceDate, sourceItems);
          }
          renderChecklist();
        });

        group.appendChild(div);
      });

      // 이 날 항목
      mine.forEach(item => {
        const div = document.createElement('div');
        div.className = 'checklist-item' + (type === 'long' ? ' long' : '') + (item.checked ? ' done' : '');
        div.innerHTML = `
          <input type="checkbox" ${item.checked ? 'checked' : ''}>
          <span>${item.text}</span>
          <button class="delete-btn">×</button>
        `;

        div.querySelector('input').addEventListener('change', (e) => {
          item.checked = e.target.checked;
          saveChecklist(dateStr, checklists);
          div.classList.toggle('done', e.target.checked);
        });

        div.querySelector('.delete-btn').addEventListener('click', () => {
          checklists.splice(checklists.indexOf(item), 1);
          saveChecklist(dateStr, checklists);
          renderChecklist();
        });

        group.appendChild(div);
      });

      list.appendChild(group);
    }

    const DOW_NAMES = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    function getDow(dateStr) {
      return new Date(dateStr + 'T00:00:00').getDay();
    }

    function getTemplate(dow) {
      try {
        const t = JSON.parse(localStorage.getItem('aurora-template-' + dow) || 'null');
        if (t && t.plan) return t;
      } catch (e) {}
      return null;
    }

    function saveTemplate(dow, tpl) {
      localStorage.setItem('aurora-template-' + dow, JSON.stringify(tpl));
      syncToSheet('template-' + dow, 'template', '', JSON.stringify(tpl));
    }

    function isPlanEmpty(dateStr) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      if (!saved) return true;
      const data = JSON.parse(saved);
      for (let h = 6; h < 24; h++) {
        if ((data.plan[h] || '').trim() !== '') return false;
      }
      return true;
    }

    // 템플릿을 해당 날짜에 적용. overwrite=false면 이미 내용이 있는 칸은 건드리지 않음
    function applyTemplate(dateStr, overwrite) {
      const tpl = getTemplate(getDow(dateStr));
      if (!tpl) return 0;

      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const focus = getFocus(dateStr);

      let applied = 0;

      for (let h = 6; h < 24; h++) {
        const text = (tpl.plan[h] || '').trim();
        if (text === '') continue;
        if (!overwrite && (data.plan[h] || '').trim() !== '') continue;

        data.plan[h] = tpl.plan[h];
        syncToSheet(dateStr, 'plan', h, tpl.plan[h]);
        applied++;

        if (tpl.focus && tpl.focus[h]) focus[h] = true;
      }

      if (applied > 0) {
        localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
        localStorage.setItem('aurora-focus-' + dateStr, JSON.stringify(focus));
        syncToSheet(dateStr, 'focus', '', JSON.stringify(focus));
      }

      return applied;
    }

    function refreshTemplatePanel() {
      const dateStr = document.getElementById('dateInput').value;
      const dow = getDow(dateStr);
      const tpl = getTemplate(dow);

      document.getElementById('templateTitle').textContent = DOW_NAMES[dow] + ' 템플릿';

      if (tpl) {
        const count = Object.keys(tpl.plan).filter(h => (tpl.plan[h] || '').trim() !== '').length;
        document.getElementById('templateDesc').textContent =
          `현재 ${count}개 시간이 저장되어 있습니다. 계획이 비어 있는 ${DOW_NAMES[dow]}을 열면 자동으로 채워집니다.`;
      } else {
        document.getElementById('templateDesc').textContent =
          `아직 저장된 템플릿이 없습니다. 매주 ${DOW_NAMES[dow]}마다 반복되는 일정을 이 날에 적어두고 저장하세요.`;
      }
    }

    document.getElementById('templateBtn').addEventListener('click', () => {
      const panel = document.getElementById('templatePanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) refreshTemplatePanel();
    });

    document.getElementById('tplSave').addEventListener('click', () => {
      const dateStr = document.getElementById('dateInput').value;
      const dow = getDow(dateStr);
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const focus = getFocus(dateStr);

      const tpl = { plan: {}, focus: {} };
      let count = 0;

      for (let h = 6; h < 24; h++) {
        const text = (data.plan[h] || '').trim();
        if (text === '') continue;
        tpl.plan[h] = data.plan[h];
        if (focus[h]) tpl.focus[h] = true;
        count++;
      }

      if (count === 0) {
        alert('이 날에 저장할 계획이 없습니다.');
        return;
      }

      if (!confirm(`${DOW_NAMES[dow]} 템플릿으로 ${count}개 시간을 저장할까요?\n기존 템플릿은 덮어씁니다.`)) return;

      saveTemplate(dow, tpl);
      refreshTemplatePanel();
      alert(`${DOW_NAMES[dow]} 템플릿을 저장했습니다.`);
    });

    document.getElementById('tplApply').addEventListener('click', () => {
      const dateStr = document.getElementById('dateInput').value;
      const dow = getDow(dateStr);

      if (!getTemplate(dow)) {
        alert(`${DOW_NAMES[dow]} 템플릿이 없습니다.`);
        return;
      }

      const overwrite = confirm(
        '이미 내용이 있는 칸도 템플릿으로 덮어쓸까요?\n\n' +
        '확인 = 전부 덮어쓰기\n취소 = 빈 칸만 채우기'
      );

      const applied = applyTemplate(dateStr, overwrite);
      renderPage();
      alert(applied + '개 시간을 채웠습니다.');
    });

    document.getElementById('tplDelete').addEventListener('click', () => {
      const dateStr = document.getElementById('dateInput').value;
      const dow = getDow(dateStr);

      if (!getTemplate(dow)) {
        alert(`${DOW_NAMES[dow]} 템플릿이 없습니다.`);
        return;
      }

      if (!confirm(`${DOW_NAMES[dow]} 템플릿을 삭제할까요?`)) return;

      localStorage.removeItem('aurora-template-' + dow);
      syncToSheet('template-' + dow, 'template', '', '');
      refreshTemplatePanel();
    });

    // 초기화
    loadAllData();
    renderChecklist();
  </script>
</body>
</html>
