<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Daily Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F9F7F4' rx='20'/><rect x='15' y='15' width='70' height='70' fill='none' stroke='%23D4B5C4' stroke-width='2' rx='8'/><line x1='30' y1='35' x2='70' y2='35' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='50' x2='70' y2='50' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='65' x2='70' y2='65' stroke='%23D4B5C4' stroke-width='2'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F9F7F4;
      padding: 2rem 1rem;
      color: #4A4240;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .date-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .date-controls button {
      padding: 8px 12px;
      background: #D4B5C4;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .date-controls button:hover {
      background: #C09DB5;
    }

    .date-controls input {
      padding: 8px 12px;
      border: 1px solid #D4B5C4;
      border-radius: 4px;
      font-size: 14px;
    }

    .progress-section {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: white;
      border-radius: 6px;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 600;
      color: #4A4240;
    }

    .progress-count {
      font-size: 12px;
      color: #8B7B78;
    }

    .progress-bar {
      height: 10px;
      background: #F0EAE5;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #D4B5C4;
      border-radius: 5px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .carryover-badge {
      display: inline-block;
      font-size: 9px;
      color: #B8875F;
      background: #F5E9DC;
      border-radius: 2px;
      padding: 1px 4px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .main {
      display: flex;
      gap: 1.5rem;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      min-height: 600px;
    }

    .sidebar {
      width: 280px;
      padding: 1.5rem;
      border-right: 1px solid #E8DFD9;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #4A4240;
      margin-bottom: 1rem;
      margin-top: 1.5rem;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .checklist-input {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .checklist-input input {
      flex: 1;
      padding: 6px 8px;
      border: 0.5px solid #E8DFD9;
      border-radius: 3px;
      font-size: 12px;
    }

    .checklist-input button {
      width: 30px;
      background: #D4B5C4;
      border: none;
      color: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }

    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .checklist-item {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem;
      background: #F5F0EB;
      border-radius: 3px;
      font-size: 12px;
      align-items: flex-start;
    }

    .checklist-item input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .checklist-item span {
      flex: 1;
      word-break: break-word;
    }

    .checklist-item .delete-btn {
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    .memo-area {
      display: flex;
      flex-direction: column;
    }

    .memo-area textarea {
      flex: 1;
      padding: 8px;
      border: 0.5px solid #E8DFD9;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }

    .timeline {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .timeline-header {
      display: flex;
      border-bottom: 1px solid #E8DFD9;
      flex-shrink: 0;
    }

    .timeline-header-item {
      flex: 1;
      padding: 1rem;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #8B7B78;
      border-right: 1px solid #E8DFD9;
    }

    .timeline-header-item:last-child {
      border-right: none;
    }

    .timeline-rows {
      flex: 1;
      display: flex;
      overflow-y: auto;
    }

    .timeline-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #E8DFD9;
    }

    .timeline-col:last-child {
      border-right: none;
    }

    .hour-row {
      display: flex;
      border-bottom: 1px solid #E8DFD9;
      min-height: 60px;
    }

    .hour-label {
      width: 40px;
      min-width: 40px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #B8A9A5;
      background: #FEFDFB;
      border-right: 1px solid #EBE2DD;
    }

    .hour-content {
      flex: 1;
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .hour-textarea {
      flex: 1;
      padding: 6px;
      border: none;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      resize: none;
      outline: none;
    }

    .match-btn {
      width: 24px;
      min-width: 24px;
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    .match-btn.active {
      color: #D4B5C4;
      font-weight: bold;
    }

    .copy-btn {
      width: 24px;
      min-width: 24px;
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    .copy-btn:hover {
      color: #D4B5C4;
    }

    .hour-row.matched .hour-textarea {
      background: rgba(212, 181, 196, 0.15);
    }

    .hour-row.past {
      background: #F9F7F4;
    }

    .hour-row.past .hour-label {
      background: #F5F0EB;
    }

    .hour-row.current .hour-label {
      background: #D4B5C4;
      color: white;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.5rem;
      }

      .header h1 {
        font-size: 20px;
        margin-bottom: 1rem;
      }

      .date-controls {
        gap: 0.4rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .date-controls button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .date-controls input {
        font-size: 14px;
        padding: 8px;
      }

      .progress-section {
        padding: 0.8rem 1rem;
        margin-bottom: 1rem;
      }

      .main {
        flex-direction: column;
        gap: 0;
        min-height: 0;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #E8DFD9;
        padding: 1rem;
      }

      .memo-area textarea {
        min-height: 70px;
      }

      .timeline {
        overflow: visible;
      }

      .timeline-header {
        position: sticky;
        top: 0;
        background: white;
        z-index: 5;
      }

      .timeline-header-item {
        padding: 0.7rem;
      }

      .timeline-rows {
        overflow: visible;
      }

      .hour-row {
        min-height: 52px;
      }

      .hour-label {
        width: 30px;
        min-width: 30px;
        padding: 6px 2px;
        font-size: 10px;
      }

      .hour-content {
        padding: 2px;
        gap: 2px;
      }

      .hour-textarea {
        padding: 4px;
        font-size: 13px;
        min-width: 0;
      }

      .match-btn,
      .copy-btn {
        width: 26px;
        min-width: 26px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Aurora Daily Planner</h1>
      <div class="date-controls">
        <button id="prevBtn">← 어제</button>
        <input type="date" id="dateInput">
        <button id="todayBtn">오늘</button>
        <button id="nextBtn">내일 →</button>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">오늘의 실행률</span>
        <span class="progress-count" id="progressCount">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="main">
      <!-- 왼쪽 사이드바 -->
      <div class="sidebar">
        <div class="section-title">체크리스트</div>
        <div class="checklist-input">
          <input type="text" id="checklistInput" placeholder="추가하기">
          <button id="addChecklistBtn">+</button>
        </div>
        <div class="checklist-list" id="checklistList"></div>

        <div class="section-title">메모</div>
        <div class="memo-area">
          <textarea id="memoInput" placeholder="오늘의 메모"></textarea>
        </div>
      </div>

      <!-- 오른쪽 타임라인 -->
      <div class="timeline">
        <div class="timeline-header">
          <div class="timeline-header-item">PLAN</div>
          <div class="timeline-header-item">ACTUAL</div>
        </div>
        <div class="timeline-rows">
          <div class="timeline-col" id="planCol"></div>
          <div class="timeline-col" id="actualCol"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1R6g9pkgX-p8jBkPU3byBZPjvq8Uj4fDUbdP6dkPQ1ZI';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyl4yAJKpb1mK4rO0nskCxZN4c8EI9gnocfg9GDB6ptb7A8gwI35YRKKErccGQ0F6E5/exec';

    // 오늘 날짜 설정
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else {
            field += c;
          }
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c === '\r') { /* skip */ }
          else field += c;
        }
      }

      if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    }

    // 데이터 불러오기
    function loadAllData() {
      fetch(CSV_URL)
        .then(r => r.text())
        .then(csv => {
          const rows = parseCSV(csv).slice(1);

          rows.forEach(parts => {
            if (parts.length < 4) return;

            const date = (parts[0] || '').trim();
            const type = (parts[1] || '').trim();
            const hour = (parts[2] || '').trim();
            const content = parts[3] || '';

            if (!date || !type) return;

            if (type === 'plan' || type === 'actual') {
              const key = 'aurora-' + date;
              const saved = localStorage.getItem(key);
              const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
              data[type][hour] = content;
              localStorage.setItem(key, JSON.stringify(data));
            } else if (type === 'memo') {
              localStorage.setItem('aurora-memo-' + date, content);
            }
          });

          console.log('시트에서 ' + rows.length + '행 로드');
          renderPage();
          renderChecklist();
        })
        .catch(err => {
          console.log('데이터 로드 실패, 로컬 데이터 사용:', err);
          renderPage();
          renderChecklist();
        });
    }

    function renderPage() {
      const dateStr = document.getElementById('dateInput').value;
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };

      // 타임라인 렌더링
      const planCol = document.getElementById('planCol');
      const actualCol = document.getElementById('actualCol');
      planCol.innerHTML = '';
      actualCol.innerHTML = '';

      const now = new Date();
      const currentHour = now.getHours();
      const isToday = dateStr === today;

      for (let h = 6; h < 24; h++) {
        const hourStr = String(h).padStart(2, '0');
        const isPast = isToday && h < currentHour;

        // PLAN
        const planRow = document.createElement('div');
        planRow.className = 'hour-row' + (isPast ? ' past' : '');
        planRow.dataset.hour = h;
        planRow.innerHTML = `
          <div class="hour-label">${hourStr}</div>
          <div class="hour-content">
            <textarea class="hour-textarea plan-textarea" data-hour="${h}"></textarea>
            <button class="match-btn" data-hour="${h}" title="매칭">✓</button>
            <button class="copy-btn" data-hour="${h}" title="복사">📋</button>
          </div>
        `;
        planCol.appendChild(planRow);

        const planTA = planRow.querySelector('.plan-textarea');
        planTA.value = data.plan[h] || '';
        planTA.addEventListener('input', () => {
          data.plan[h] = planTA.value;
          localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
          syncToSheet(dateStr, 'plan', h, planTA.value);
          updateMatching(dateStr, h);
        });

        planRow.querySelector('.match-btn').addEventListener('click', () => toggleMatch(dateStr, h));
        planRow.querySelector('.copy-btn').addEventListener('click', () => copyToActual(h, data));

        // ACTUAL
        const actualRow = document.createElement('div');
        actualRow.className = 'hour-row' + (isPast ? ' past' : '');
        actualRow.dataset.hour = h;
        actualRow.innerHTML = `
          <div class="hour-label">${hourStr}</div>
          <div class="hour-content">
            <textarea class="hour-textarea actual-textarea" data-hour="${h}"></textarea>
            <button class="match-btn" data-hour="${h}" title="매칭">✓</button>
          </div>
        `;
        actualCol.appendChild(actualRow);

        const actualTA = actualRow.querySelector('.actual-textarea');
        actualTA.value = data.actual[h] || '';
        actualTA.addEventListener('input', () => {
          data.actual[h] = actualTA.value;
          localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
          syncToSheet(dateStr, 'actual', h, actualTA.value);
          updateMatching(dateStr, h);
        });

        actualRow.querySelector('.match-btn').addEventListener('click', () => toggleMatch(dateStr, h));

        updateMatching(dateStr, h);
      }

      // 메모 렌더링
      const memo = localStorage.getItem('aurora-memo-' + dateStr) || '';
      document.getElementById('memoInput').value = memo;
      document.getElementById('memoInput').addEventListener('input', (e) => {
        localStorage.setItem('aurora-memo-' + dateStr, e.target.value);
        syncToSheet(dateStr, 'memo', '', e.target.value);
      });

      updateProgress();
    }

    function updateProgress() {
      const dateStr = document.getElementById('dateInput').value;
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};

      let planned = 0;
      let done = 0;

      for (let h = 6; h < 24; h++) {
        const planValue = (data.plan[h] || '').trim();
        if (planValue === '') continue;

        planned++;

        const actualValue = (data.actual[h] || '').trim();
        const isAutoMatch = planValue === actualValue;
        const isManualMatch = matchedData[h] === true;

        if (isAutoMatch || isManualMatch) done++;
      }

      const percent = planned === 0 ? 0 : Math.round((done / planned) * 100);
      document.getElementById('progressCount').textContent = `${done} / ${planned} (${percent}%)`;
      document.getElementById('progressFill').style.width = percent + '%';
    }

    function updateMatching(dateStr, hour) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};

      const planTA = document.querySelector(`#planCol .plan-textarea[data-hour="${hour}"]`);
      const actualTA = document.querySelector(`#actualCol .actual-textarea[data-hour="${hour}"]`);

      if (!planTA || !actualTA) return;

      const planRow = planTA.closest('.hour-row');
      const actualRow = actualTA.closest('.hour-row');

      if (!planRow || !actualRow) return;

      const planValue = (data.plan[hour] || '').trim();
      const actualValue = (data.actual[hour] || '').trim();
      const isManualMatch = matchedData[hour] === true;
      const isAutoMatch = planValue === actualValue && planValue !== '';

      if (isAutoMatch || isManualMatch) {
        planRow.classList.add('matched');
        actualRow.classList.add('matched');
      } else {
        planRow.classList.remove('matched');
        actualRow.classList.remove('matched');
      }

      const planBtn = planRow.querySelector('.match-btn');
      const actualBtn = actualRow.querySelector('.match-btn');
      if (isManualMatch) {
        planBtn.classList.add('active');
        actualBtn.classList.add('active');
      } else {
        planBtn.classList.remove('active');
        actualBtn.classList.remove('active');
      }

      updateProgress();
    }

    function toggleMatch(dateStr, hour) {
      const matched = localStorage.getItem('aurora-matched-' + dateStr);
      const matchedData = matched ? JSON.parse(matched) : {};
      matchedData[hour] = !matchedData[hour];
      localStorage.setItem('aurora-matched-' + dateStr, JSON.stringify(matchedData));
      updateMatching(dateStr, hour);
    }

    function copyToActual(hour, data) {
      const saved = localStorage.getItem('aurora-' + document.getElementById('dateInput').value);
      const currentData = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      currentData.actual[hour] = currentData.plan[hour];
      const dateStr = document.getElementById('dateInput').value;
      localStorage.setItem('aurora-' + dateStr, JSON.stringify(currentData));
      syncToSheet(dateStr, 'actual', hour, currentData.plan[hour]);
      renderPage();
    }

    const syncTimers = {};

    function syncToSheet(dateStr, type, hour, content) {
      const key = `${dateStr}-${type}-${hour}`;
      
      // 기존 타이머 취소
      if (syncTimers[key]) {
        clearTimeout(syncTimers[key]);
      }
      
      // 1초 후에 저장 (입력이 멈춘 후)
      syncTimers[key] = setTimeout(() => {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ date: dateStr, type, hour, content })
        }).catch(err => console.log('Sync 실패:', err));
        delete syncTimers[key];
      }, 1000);
    }

    // 날짜 컨트롤
    document.getElementById('prevBtn').addEventListener('click', () => {
      const date = new Date(document.getElementById('dateInput').value);
      date.setDate(date.getDate() - 1);
      document.getElementById('dateInput').value = date.toISOString().split('T')[0];
      renderPage();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      document.getElementById('dateInput').value = today;
      renderPage();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const date = new Date(document.getElementById('dateInput').value);
      date.setDate(date.getDate() + 1);
      document.getElementById('dateInput').value = date.toISOString().split('T')[0];
      renderPage();
    });

    document.getElementById('dateInput').addEventListener('change', renderPage);

    // 체크리스트
    document.getElementById('addChecklistBtn').addEventListener('click', () => {
      const input = document.getElementById('checklistInput');
      if (!input.value.trim()) return;
      
      const dateStr = document.getElementById('dateInput').value;
      const checklistKey = 'aurora-checklist-' + dateStr;
      const checklists = JSON.parse(localStorage.getItem(checklistKey) || '[]');
      checklists.push({ id: Date.now(), text: input.value, checked: false });
      localStorage.setItem(checklistKey, JSON.stringify(checklists));
      input.value = '';
      renderChecklist();
    });

    function renderChecklist() {
      const dateStr = document.getElementById('dateInput').value;
      const checklistKey = 'aurora-checklist-' + dateStr;
      const checklists = JSON.parse(localStorage.getItem(checklistKey) || '[]');

      // 이전 날짜들의 미완료 항목 수집
      const carryovers = [];
      const seen = new Set(checklists.map(c => c.text));

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('aurora-checklist-')) continue;

        const keyDate = key.replace('aurora-checklist-', '');
        if (keyDate >= dateStr) continue;

        let items;
        try {
          items = JSON.parse(localStorage.getItem(key) || '[]');
        } catch (e) {
          continue;
        }

        items.forEach(item => {
          if (item.checked) return;
          if (seen.has(item.text)) return;
          seen.add(item.text);
          carryovers.push({ item, sourceDate: keyDate, sourceKey: key });
        });
      }

      carryovers.sort((a, b) => a.sourceDate.localeCompare(b.sourceDate));

      const list = document.getElementById('checklistList');
      list.innerHTML = '';

      // 이월 항목 먼저 표시
      carryovers.forEach(({ item, sourceDate, sourceKey }) => {
        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `
          <input type="checkbox">
          <span><span class="carryover-badge">${sourceDate.slice(5)}</span>${item.text}</span>
          <button class="delete-btn">×</button>
        `;

        div.querySelector('input').addEventListener('change', (e) => {
          const sourceItems = JSON.parse(localStorage.getItem(sourceKey) || '[]');
          const target = sourceItems.find(s => s.id === item.id);
          if (target) {
            target.checked = e.target.checked;
            localStorage.setItem(sourceKey, JSON.stringify(sourceItems));
          }
          renderChecklist();
        });

        div.querySelector('.delete-btn').addEventListener('click', () => {
          const sourceItems = JSON.parse(localStorage.getItem(sourceKey) || '[]');
          const idx = sourceItems.findIndex(s => s.id === item.id);
          if (idx > -1) {
            sourceItems.splice(idx, 1);
            localStorage.setItem(sourceKey, JSON.stringify(sourceItems));
          }
          renderChecklist();
        });

        list.appendChild(div);
      });

      // 오늘 항목
      checklists.forEach(item => {
        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `
          <input type="checkbox" ${item.checked ? 'checked' : ''}>
          <span>${item.text}</span>
          <button class="delete-btn">×</button>
        `;

        div.querySelector('input').addEventListener('change', (e) => {
          item.checked = e.target.checked;
          localStorage.setItem(checklistKey, JSON.stringify(checklists));
          renderChecklist();
        });

        div.querySelector('.delete-btn').addEventListener('click', () => {
          checklists.splice(checklists.indexOf(item), 1);
          localStorage.setItem(checklistKey, JSON.stringify(checklists));
          renderChecklist();
        });

        list.appendChild(div);
      });
    }

    // 초기화
    loadAllData();
    renderChecklist();
    document.getElementById('dateInput').addEventListener('change', renderChecklist);
  </script>
</body>
</html>
