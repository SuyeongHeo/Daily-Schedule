<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Daily Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F9F7F4' rx='20'/><rect x='15' y='15' width='70' height='70' fill='none' stroke='%23D4B5C4' stroke-width='2' rx='8'/><line x1='30' y1='35' x2='70' y2='35' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='50' x2='70' y2='50' stroke='%23D4B5C4' stroke-width='2'/><line x1='30' y1='65' x2='70' y2='65' stroke='%23D4B5C4' stroke-width='2'/></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F9F7F4;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      color: #4A4240;
      margin-bottom: 1rem;
    }

    .date-control {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .date-nav-btn {
      padding: 6px 12px;
      background: #D4B5C4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .date-nav-btn:hover {
      background: #C4A5B4;
    }

    #dateInput {
      padding: 6px 10px;
      border: 0.5px solid #D4B5C4;
      border-radius: 4px;
      font-size: 13px;
      background: #FEFDFB;
      color: #4A4240;
      cursor: pointer;
      font-family: inherit;
    }

    #saveStatus {
      margin-top: 0.5rem;
      font-size: 11px;
      color: #B8A9A5;
      min-height: 20px;
    }

    .main-container {
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      overflow: hidden;
      height: 1400px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .date-header {
      text-align: center;
      padding: 1.5rem;
      border-bottom: 1px solid #E8DFD9;
      width: 100%;
    }

    .date-label {
      font-size: 11px;
      color: #B8A9A5;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }

    .date-display {
      font-size: 16px;
      font-weight: 500;
      color: #4A4240;
    }

    .day-display {
      font-size: 12px;
      color: #8B7B78;
      margin-top: 0.3rem;
    }

    .content-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .checklist-section {
      width: 280px;
      min-width: 280px;
      padding: 1.5rem;
      border-right: 1px solid #E8DFD9;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: white;
    }

    .checklist-title {
      font-size: 12px;
      color: #4A4240;
      font-weight: 500;
      margin-bottom: 0.8rem;
      flex-shrink: 0;
    }

    .checklist-input-group {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    #checklistInput {
      flex: 1;
      padding: 6px 8px;
      border: 0.5px solid #E8DFD9;
      border-radius: 3px;
      font-size: 12px;
      background: #FEFDFB;
      color: #4A4240;
      font-family: inherit;
      outline: none;
    }

    #checklistInput:focus {
      border-color: #D4B5C4;
      box-shadow: inset 0 0 2px rgba(212, 181, 196, 0.2);
    }

    #addChecklistBtn {
      padding: 6px 12px;
      background: #D4B5C4;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    #addChecklistBtn:hover {
      background: #C4A5B4;
    }

    #checklistContainer {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.8rem;
      background: #F5F0EB;
      border-radius: 3px;
      cursor: move;
      user-select: none;
      min-width: 0;
    }

    .checklist-item.checked {
      opacity: 0.6;
    }

    .checklist-item input[type="checkbox"] {
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .checklist-item span {
      flex: 1;
      font-size: 12px;
      color: #4A4240;
      text-decoration: none;
      word-break: break-word;
      line-height: 1.3;
      padding: 2px 4px;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .checklist-item span:hover {
      background: rgba(212, 181, 196, 0.1);
    }

    .checklist-item.checked span {
      text-decoration: line-through;
    }

    .checklist-item button {
      background: none;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 2px;
    }

    .timeline-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .timeline-headers {
      display: flex;
      gap: 0;
      flex-shrink: 0;
    }

    .timeline-header-item {
      flex: 1;
      text-align: center;
      padding: 1rem;
      border-bottom: 1px solid #E8DFD9;
    }

    .timeline-header-item:first-child {
      border-right: 1px solid #E8DFD9;
    }

    .timeline-content {
      flex: 1;
      display: flex;
      gap: 0;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      min-height: 0;
    }

    .timeline-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .timeline-column:first-child {
      border-right: 1px solid #E8DFD8;
    }

    .copy-btn {
      width: 28px;
      min-width: 28px;
      padding: 0 4px;
      background: transparent;
      border: none;
      color: #B8A9A5;
      cursor: pointer;
      font-size: 14px;
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:hover {
      color: #D4B5C4;
      background: rgba(212, 181, 196, 0.05);
    }

    .timeline-row {
      display: flex;
      border-bottom: 1px solid #E8DFD9;
      position: relative;
    }

    .timeline-row.past {
      background: #F9F7F4;
    }

    .timeline-row.current::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #D4B5C4;
      box-shadow: 0 0 4px rgba(212, 181, 196, 0.5);
      z-index: 5;
    }

    .timeline-hour {
      width: 35px;
      min-width: 35px;
      padding: 8px 4px;
      text-align: center;
      border-right: 1px solid #EBE2DD;
      background: #FEFDFB;
    }

    .timeline-row.past .timeline-hour {
      background: #F5F0EB;
    }

    .timeline-hour span {
      font-size: 10px;
      color: #B8A9A5;
      font-weight: 500;
    }

    textarea {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      color: #4A4240;
      resize: none;
      outline: none;
      min-height: 50px;
      line-height: 1.4;
    }

    .timeline-row.past textarea {
      background: transparent;
      color: #9D8D8A;
    }

    textarea:focus {
      background: rgba(212, 181, 196, 0.05);
    }

    .timeline-row.past textarea:focus {
      background: rgba(0, 0, 0, 0.02);
    }

    .timeline-row.matched textarea {
      background: rgba(212, 181, 196, 0.15) !important;
    }

    .timeline-row.matched textarea:focus {
      background: rgba(212, 181, 196, 0.25) !important;
    }

    .timeline-row.past.matched textarea {
      background: rgba(212, 181, 196, 0.2) !important;
      color: #4A4240;
    }

    .timeline-row.past.matched textarea:focus {
      background: rgba(212, 181, 196, 0.3) !important;
    }

    .footer {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(212, 181, 196, 0.08);
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      color: #8B7B78;
    }

    .current-time-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #D4B5C4;
      box-shadow: 0 0 4px rgba(212, 181, 196, 0.5);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 타이틀 -->
    <div class="header">
      <h1>Daily Schedule</h1>
      <div class="date-control">
        <button class="date-nav-btn" id="prevBtn">← 어제</button>
        <input type="date" id="dateInput">
        <button class="date-nav-btn" id="todayBtn">오늘</button>
        <button class="date-nav-btn" id="nextBtn">내일 →</button>
      </div>
      <div id="saveStatus"></div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
      
      <!-- 상단 헤더 (날짜) -->
      <div class="date-header">
        <div class="date-label">Today</div>
        <div class="date-display" id="dateDisplay">12/25</div>
        <div class="day-display" id="dayDisplay">Thursday</div>
      </div>

      <!-- 콘텐츠 래퍼 -->
      <div class="content-wrapper">
        
        <!-- 체크리스트 섹션 (왼쪽 사이드바) -->
        <div class="checklist-section">
          <div class="checklist-title">체크리스트</div>
          <div class="checklist-input-group">
            <input type="text" id="checklistInput" placeholder="추가하기">
            <button id="addChecklistBtn">+</button>
          </div>
          <div id="checklistContainer"></div>
        </div>

        <!-- 타임라인 래퍼 (오른쪽) -->
        <div class="timeline-wrapper">
          
          <!-- PLAN / ACTUAL 헤더 -->
          <div class="timeline-headers">
            <div class="timeline-header-item">
              <div class="date-label">PLAN</div>
            </div>
            <div class="timeline-header-item">
              <div class="date-label">ACTUAL</div>
            </div>
          </div>

          <!-- 콘텐츠 섹션 -->
          <div class="timeline-content">
            <!-- 좌측 - PLAN -->
            <div class="timeline-column" id="planContainer"></div>

            <!-- 우측 - ACTUAL -->
            <div class="timeline-column" id="actualContainer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 사용 가이드 -->
    <div class="footer">
      💡 체크리스트 항목을 드래그해서 원하는 시간대에 드롭하면 복사됩니다. 완료하지 못한 항목은 다음날에도 남아있습니다.
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyl4yAJKpb1mK4rO0nskCxZN4c8EI9gnocfg9GDB6ptb7A8gwI35YRKKErccGQ0F6E5/exec';
    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    let draggedItem = null;
    let saveTimeout = null;

    function initPlanner() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateInput').value = today;
      
      updateDisplay();
      renderChecklist();
      renderTimeline();
      updateCurrentTimeIndicator();
      
      document.getElementById('dateInput').addEventListener('change', () => {
        updateDisplay();
        renderChecklist();
        renderTimeline();
        updateCurrentTimeIndicator();
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        const date = new Date(document.getElementById('dateInput').value);
        date.setDate(date.getDate() - 1);
        document.getElementById('dateInput').value = date.toISOString().split('T')[0];
        updateDisplay();
        renderChecklist();
        renderTimeline();
        updateCurrentTimeIndicator();
      });

      document.getElementById('todayBtn').addEventListener('click', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').value = today;
        updateDisplay();
        renderChecklist();
        renderTimeline();
        updateCurrentTimeIndicator();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        const date = new Date(document.getElementById('dateInput').value);
        date.setDate(date.getDate() + 1);
        document.getElementById('dateInput').value = date.toISOString().split('T')[0];
        updateDisplay();
        renderChecklist();
        renderTimeline();
        updateCurrentTimeIndicator();
      });

      document.getElementById('addChecklistBtn').addEventListener('click', addChecklistItem);
      document.getElementById('checklistInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addChecklistItem();
      });
    }

    function updateDisplay() {
      const dateStr = document.getElementById('dateInput').value;
      const date = new Date(dateStr + 'T00:00:00');
      const displayDate = date.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
      const dayName = dayNames[date.getDay()];
      
      document.getElementById('dateDisplay').textContent = displayDate;
      document.getElementById('dayDisplay').textContent = dayName;
    }

    function addChecklistItem() {
      const input = document.getElementById('checklistInput');
      const value = input.value.trim();
      
      if (!value) return;
      
      const dateStr = document.getElementById('dateInput').value;
      const saved = localStorage.getItem('aurora-checklists-' + dateStr);
      const checklists = saved ? JSON.parse(saved) : [];
      
      const newItem = { id: Date.now(), text: value, checked: false };
      checklists.push(newItem);
      localStorage.setItem('aurora-checklists-' + dateStr, JSON.stringify(checklists));
      
      syncToGoogleSheets(dateStr, 'checklist', 'add', value);
      
      input.value = '';
      renderChecklist();
    }

    function getChecklistForDate(dateStr) {
      const saved = localStorage.getItem('aurora-checklists-' + dateStr);
      let checklists = saved ? JSON.parse(saved) : [];
      
      // 어제 미완료 항목 가져오기
      const currentDate = new Date(dateStr + 'T00:00:00');
      const yesterday = new Date(currentDate);
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().split('T')[0];
      
      const yesterdaySaved = localStorage.getItem('aurora-checklists-' + yesterdayStr);
      if (yesterdaySaved) {
        const yesterdayChecklists = JSON.parse(yesterdaySaved);
        const uncompleted = yesterdayChecklists.filter(item => !item.checked);
        
        // 어제의 미완료 항목을 오늘에 추가 (중복 제거)
        uncompleted.forEach(item => {
          if (!checklists.find(c => c.id === item.id)) {
            checklists.unshift(item);
          }
        });
        
        // 변경사항 저장
        if (uncompleted.length > 0) {
          localStorage.setItem('aurora-checklists-' + dateStr, JSON.stringify(checklists));
        }
      }
      
      return checklists;
    }

    function renderChecklist() {
      const dateStr = document.getElementById('dateInput').value;
      const checklists = getChecklistForDate(dateStr);
      
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';
      
      checklists.forEach(item => {
        const checklistItem = document.createElement('div');
        checklistItem.className = 'checklist-item' + (item.checked ? ' checked' : '');
        checklistItem.draggable = true;
        checklistItem.dataset.itemId = item.id;
        checklistItem.dataset.text = item.text;
        
        checklistItem.innerHTML = `
          <input type="checkbox" ${item.checked ? 'checked' : ''}>
          <span class="checklist-text">${item.text}</span>
          <button class="delete-btn">×</button>
        `;
        
        const checkbox = checklistItem.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', () => toggleChecklistItem(dateStr, item.id));
        
        const textSpan = checklistItem.querySelector('.checklist-text');
        textSpan.addEventListener('click', () => editChecklistItem(checklistItem, dateStr, item.id, item.text));
        textSpan.style.cursor = 'pointer';
        
        const deleteBtn = checklistItem.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => deleteChecklistItem(dateStr, item.id));
        
        checklistItem.addEventListener('dragstart', (e) => {
          draggedItem = item;
          e.dataTransfer.effectAllowed = 'copy';
          e.dataTransfer.setData('text/plain', item.text);
        });
        
        container.appendChild(checklistItem);
      });
    }

    function toggleChecklistItem(dateStr, id) {
      const checklists = getChecklistForDate(dateStr);
      
      const item = checklists.find(c => c.id === id);
      if (item) {
        item.checked = !item.checked;
        syncToGoogleSheets(dateStr, 'checklist', 'toggle', item.text);
      }
      
      localStorage.setItem('aurora-checklists-' + dateStr, JSON.stringify(checklists));
      renderChecklist();
    }

    function editChecklistItem(checklistItem, dateStr, id, originalText) {
      const textSpan = checklistItem.querySelector('.checklist-text');
      
      // 이미 편집 중이면 취소
      if (textSpan.tagName === 'INPUT') return;
      
      const editInput = document.createElement('input');
      editInput.type = 'text';
      editInput.value = originalText;
      editInput.style.cssText = `
        flex: 1;
        padding: 4px 6px;
        border: 0.5px solid #D4B5C4;
        border-radius: 3px;
        font-size: 12px;
        background: #FEFDFB;
        color: #4A4240;
        font-family: inherit;
        outline: none;
      `;
      
      checklistItem.replaceChild(editInput, textSpan);
      editInput.focus();
      editInput.select();
      
      function saveEdit() {
        const newText = editInput.value.trim();
        if (newText && newText !== originalText) {
          const checklists = getChecklistForDate(dateStr);
          const item = checklists.find(c => c.id === id);
          if (item) {
            item.text = newText;
            localStorage.setItem('aurora-checklists-' + dateStr, JSON.stringify(checklists));
            syncToGoogleSheets(dateStr, 'checklist', 'edit', newText);
          }
        }
        renderChecklist();
      }
      
      function cancelEdit() {
        renderChecklist();
      }
      
      editInput.addEventListener('blur', saveEdit);
      editInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          editInput.blur();
        }
      });
      editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          cancelEdit();
        }
      });
    }

    function deleteChecklistItem(dateStr, id) {
      const checklists = getChecklistForDate(dateStr);
      
      const item = checklists.find(c => c.id === id);
      const filtered = checklists.filter(c => c.id !== id);
      
      if (item) {
        syncToGoogleSheets(dateStr, 'checklist', 'delete', item.text);
      }
      
      localStorage.setItem('aurora-checklists-' + dateStr, JSON.stringify(filtered));
      renderChecklist();
    }

    function isToday() {
      const dateStr = document.getElementById('dateInput').value;
      const today = new Date().toISOString().split('T')[0];
      return dateStr === today;
    }

    function getCurrentHour() {
      return new Date().getHours();
    }

    function renderTimeline() {
      const dateStr = document.getElementById('dateInput').value;
      const planContainer = document.getElementById('planContainer');
      const actualContainer = document.getElementById('actualContainer');
      
      planContainer.innerHTML = '';
      actualContainer.innerHTML = '';
      
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      
      const currentHour = getCurrentHour();
      const today = isToday();
      
      // 06:00부터 시작 (06:00 ~ 23:59, 그 다음 00:00 ~ 05:59)
      const startHour = 6;
      
      for (let i = 0; i < 24; i++) {
        const hour = (startHour + i) % 24;
        const hourStr = String(hour).padStart(2, '0');
        
        // 06:00 기준으로 과거 판정
        let isPast = false;
        if (today) {
          if (currentHour >= startHour) {
            // 현재 시간이 06:00 이상: 06:00부터 현재시간까지가 past
            isPast = hour >= startHour && hour < currentHour;
          } else {
            // 현재 시간이 06:00 미만 (새벽): 06:00부터 23:59까지가 past
            isPast = hour >= startHour || hour < currentHour;
          }
        }
        
        const isCurrent = today && hour === currentHour;
        
        // PLAN
        const planRow = document.createElement('div');
        planRow.className = 'timeline-row' + (isPast ? ' past' : '') + (isCurrent ? ' current' : '');
        planRow.dataset.hour = hour;
        planRow.innerHTML = `
          <div class="timeline-hour"><span>${hourStr}</span></div>
          <textarea id="plan-${hour}" placeholder="계획"></textarea>
          <button class="copy-btn" title="ACTUAL에 복사">📋</button>
        `;
        planContainer.appendChild(planRow);
        
        const planTA = planRow.querySelector('textarea');
        planTA.value = data.plan[hour] || '';
        planTA.addEventListener('input', () => {
          savePlan(dateStr, hour, planTA.value);
          updateMatchedRows(dateStr);
        });
        planTA.addEventListener('blur', () => planTA.style.background = 'transparent');
        
        const copyBtn = planRow.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => copyPlanToActual(hour));
        
        planTA.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
          planTA.style.background = 'rgba(212, 181, 196, 0.1)';
        });
        
        planTA.addEventListener('dragleave', () => {
          planTA.style.background = 'transparent';
        });
        
        planTA.addEventListener('drop', (e) => {
          e.preventDefault();
          const text = e.dataTransfer.getData('text/plain');
          if (text && draggedItem) {
            planTA.value = (planTA.value ? planTA.value + '\n' : '') + text;
            savePlan(dateStr, hour, planTA.value);
            updateMatchedRows(dateStr);
            planTA.style.background = 'transparent';
          }
        });
        
        // ACTUAL
        const actualRow = document.createElement('div');
        actualRow.className = 'timeline-row' + (isPast ? ' past' : '') + (isCurrent ? ' current' : '');
        actualRow.dataset.hour = hour;
        actualRow.innerHTML = `
          <div class="timeline-hour"><span>${hourStr}</span></div>
          <textarea id="actual-${hour}" placeholder="실행"></textarea>
        `;
        actualContainer.appendChild(actualRow);
        
        const actualTA = actualRow.querySelector('textarea');
        actualTA.value = data.actual[hour] || '';
        actualTA.addEventListener('input', () => {
          saveActual(dateStr, hour, actualTA.value);
          updateMatchedRows(dateStr);
        });
        actualTA.addEventListener('blur', () => actualTA.style.background = 'transparent');
      }
      
      // 렌더링 후 매칭 확인
      updateMatchedRows(dateStr);
    }

    function updateCurrentTimeIndicator() {
      const today = isToday();
      if (!today) return;
      
      const currentHour = getCurrentHour();
      const startHour = 6;
      
      // 현재 시간이 타임라인 상에서 어느 인덱스인지 계산
      let indexInTimeline = currentHour - startHour;
      if (indexInTimeline < 0) {
        indexInTimeline = 24 + indexInTimeline; // 00:00~05:59는 뒤에 있음
      }
      
      const timelineContent = document.querySelector('.timeline-content');
      
      // 현재 시간 행으로 스크롤
      const planRows = document.querySelectorAll('#planContainer .timeline-row');
      if (planRows[indexInTimeline]) {
        setTimeout(() => {
          planRows[indexInTimeline].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    function savePlan(dateStr, hour, value) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      data.plan[hour] = value;
      localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
      
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        syncToGoogleSheets(dateStr, 'plan', hour, value);
      }, 1000);
    }

    function saveActual(dateStr, hour, value) {
      const saved = localStorage.getItem('aurora-' + dateStr);
      const data = saved ? JSON.parse(saved) : { plan: {}, actual: {} };
      data.actual[hour] = value;
      localStorage.setItem('aurora-' + dateStr, JSON.stringify(data));
      
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        syncToGoogleSheets(dateStr, 'actual', hour, value);
      }, 1000);
    }

    function syncToGoogleSheets(date, type, hour, content) {
      const payload = {
        date: date,
        type: type,
        hour: hour,
        content: content
      };
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          showSaveStatus('저장됨');
        }
      })
      .catch(error => {
        console.log('Save error:', error);
        showSaveStatus('로컬 저장됨');
      });
    }

    function showSaveStatus(message) {
      const status = document.getElementById('saveStatus');
      status.textContent = message;
      setTimeout(() => {
        status.textContent = '';
      }, 2000);
    }

    function updateMatchedRows(dateStr) {
      const data = localStorage.getItem('aurora-' + dateStr);
      const planData = data ? JSON.parse(data).plan : {};
      const actualData = data ? JSON.parse(data).actual : {};
      
      for (let hour = 0; hour < 24; hour++) {
        const planTA = document.getElementById('plan-' + hour);
        const actualTA = document.getElementById('actual-' + hour);
        
        if (planTA && actualTA) {
          const planRow = planTA.closest('.timeline-row');
          const actualRow = actualTA.closest('.timeline-row');
          
          const planValue = planTA.value.trim();
          const actualValue = actualTA.value.trim();
          
          // PLAN과 ACTUAL이 같고 둘 다 비어있지 않으면 matched 클래스 추가
          if (planValue === actualValue && planValue !== '') {
            planRow.classList.add('matched');
            actualRow.classList.add('matched');
          } else {
            planRow.classList.remove('matched');
            actualRow.classList.remove('matched');
          }
        }
      }
    }

    function copyPlanToActual(hour) {
      const planTA = document.getElementById('plan-' + hour);
      const actualTA = document.getElementById('actual-' + hour);
      
      if (planTA && actualTA) {
        const dateStr = document.getElementById('dateInput').value;
        actualTA.value = planTA.value;
        saveActual(dateStr, hour, planTA.value);
        
        // 매칭 상태 업데이트
        updateMatchedRows(dateStr);
        
        // 복사 완료 피드백
        showSaveStatus('복사됨');
      }
    }

    initPlanner();
  </script>
</body>
</html>
